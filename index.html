      </div></div>`;
  }
  html += `</div>`;

  // completo?
  const completo = Object.keys(LG.pred.cuartos).filter(k=>LG.pred.cuartos[k]).length===4
    && LG.pred.semis[1] && LG.pred.semis[2] && LG.pred.campeon;

  if(!cerrado){
    html += `<button class="sv-guardar" id="lg-guardar" ${completo?'':'disabled'}>
      ${completo?'Guardar mi bracket':'Completa todo el cuadro'}</button>`;
  }
  html += `<div id="lg-msg"></div>`;

  // ------- CAPA B (pronósticos por ronda) -------
  html += renderCapaB();

  c.innerHTML = html;
  conectarLgToggle(c);
  conectarLgTickets(c);
  if(!cerrado) conectarLgBracket(c);
  conectarCapaB(c);
  arrancaCountdowns();
}

// ------- CAPA B: pronósticos L/E/V de ida y vuelta por serie viva -------
const LG_PTS_B = { cuartos:1, semis:2, final:3 };
function lgCasaSerie(s, p){
  return (s.equipo_a_id===p.equipo_local_id && s.equipo_b_id===p.equipo_visitante_id)
      || (s.equipo_a_id===p.equipo_visitante_id && s.equipo_b_id===p.equipo_local_id);
}
function renderCapaB(){
  if(!LG.capBpartidos){
    return `<div class="lg-ronda" style="margin-top:22px">
      <div class="lg-ronda-tit"><h3>Pronósticos por ronda (L/E/V)</h3></div>
      <div class="lg-hint">Se habilitan cuando el admin cargue los partidos de la liguilla (cuartos, semis y final).</div></div>`;
  }
  let html = `<div class="lg-ronda" style="margin-top:22px">
    <div class="lg-ronda-tit"><h3>Pronósticos por ronda (L/E/V)</h3></div>
    <div class="lg-instru">Marca L/E/V de la <b>ida</b> y la <b>vuelta</b> de cada serie ya definida. Cada partido cierra en su propio arranque. Puntos por partido: cuartos <b>1</b>, semis <b>2</b>, final <b>3</b>.</div>`;
  let algo = false;
  ["cuartos","semis","final"].forEach(ronda=>{
    const arr = (LG.series[ronda]||[]).filter(s=>s.equipo_a_id && s.equipo_b_id);
    const conPartidos = arr.map(s=>({
      s, legs: LG.partidos.filter(p=>lgCasaSerie(s,p)).slice().sort((a,b)=> new Date(a.kickoff)-new Date(b.kickoff))
    })).filter(x=>x.legs.length);
    if(!conPartidos.length) return;
    algo = true;
    const pts = LG_PTS_B[ronda];
    html += `<div class="lg-ronda-tit" style="margin-top:14px"><h3 style="font-size:16px">${RONDA_NOMBRE[ronda]}</h3><span class="pts">${pts} pt${pts>1?'s':''} c/u</span></div>`;
    conPartidos.forEach(({legs})=>{
      legs.forEach((p,i)=> html += filaCapaB(p, i===0?'Ida':'Vuelta'));
    });
  });
  if(!algo){
    html += `<div class="lg-hint">Aún no hay series con ambos equipos definidos y partidos cargados.</div>`;
  } else {
    html += `<button class="sv-guardar" id="lg-guardarB">Guardar pronósticos</button><div id="lg-msgB"></div>`;
  }
  html += `</div>`;
  return html;
}
function filaCapaB(p, etiqueta){
  const cerrado = new Date(p.kickoff) <= new Date() || p.pospuesto || p.bloqueado_manual;
  const pick = LG.pbSel[p.id] || null;
  let estado = '';
  if(p.pospuesto) estado = `<span class="qn-flag posp">pospuesto</span>`;
  else if(p.bloqueado_manual) estado = `<span class="qn-flag posp">bloqueado</span>`;
  let botones = '';
  ['L','E','V'].forEach(op=>{
    const sel = pick===op;
    botones += `<button class="qn-lev ${sel?'sel':''}" data-levb="${op}" data-part="${p.id}" ${cerrado?'disabled':''}>${op}</button>`;
  });
  return `
  <div class="qn-partido ${cerrado?'cerrado':''}">
    <div class="qn-part-top">
      <span class="lg-leg-tag">${etiqueta}</span>
      ${estado}
      <span class="qn-cd" data-countdown="${p.kickoff}" data-prefijo="cierra en " data-cerrado-label="cerrado 🔒"></span>
    </div>
    <div class="qn-matchup">
      <div class="qn-eq">${escudoMini(p.loc)}<span>${escapa(p.loc?.nombre_corto||p.loc?.nombre||'?')}</span></div>
      <div class="qn-lev-box">${botones}</div>
      <div class="qn-eq">${escudoMini(p.vis)}<span>${escapa(p.vis?.nombre_corto||p.vis?.nombre||'?')}</span></div>
    </div>
  </div>`;
}
function conectarCapaB(c){
  c.querySelectorAll(".qn-lev[data-levb]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const pid=b.dataset.part, op=b.dataset.levb;
      LG.pbSel[pid] = (LG.pbSel[pid]===op) ? null : op;
      c.querySelectorAll(`.qn-lev[data-levb][data-part="${pid}"]`).forEach(x=>
        x.classList.toggle("sel", x.dataset.levb===LG.pbSel[pid]));
    });
  });
  const g = $("lg-guardarB");
  if(g) g.addEventListener("click", guardarCapaB);
}
async function guardarCapaB(){
  const g = $("lg-guardarB"), msg = $("lg-msgB");
  if(!LG.ticketSel){ msg.innerHTML = `<div class="sv-msg err">Elige un boleto primero.</div>`; return; }
  g.disabled = true; g.textContent = "Guardando…"; msg.innerHTML = "";
  const ahora = new Date();
  const abiertos = LG.partidos.filter(p=> !(new Date(p.kickoff)<=ahora || p.pospuesto || p.bloqueado_manual));
  const filas = [];
  abiertos.forEach(p=>{
    const v = LG.pbSel[p.id];
    if(v==='L'||v==='E'||v==='V'){
      filas.push({ torneo_id:LG.torneo.id, ticket_id:LG.ticketSel, partido_id:p.id, pronostico:v });
    }
  });
  if(!filas.length){
    msg.innerHTML = `<div class="sv-msg err">No hay pronósticos en partidos abiertos.</div>`;
    g.disabled = false; g.textContent = "Guardar pronósticos"; return;
  }
  const { error } = await sb.from("liguilla_pick")
    .upsert(filas, { onConflict:'ticket_id,partido_id' });
  if(error){
    msg.innerHTML = `<div class="sv-msg err">${escapa(traduceCapaB(error.message))}</div>`;
    g.disabled = false; g.textContent = "Guardar pronósticos"; return;
  }
  filas.forEach(f=> LG.picksB[f.partido_id] = f.pronostico);
  msg.innerHTML = `<div class="sv-msg ok">¡Pronósticos guardados!</div>`;
  g.disabled = false; g.textContent = "Guardar pronósticos";
  setTimeout(()=>{ const m=msg.querySelector('.sv-msg'); if(m) m.remove(); }, 2500);
}
function traduceCapaB(m){
  m = (m||"").toLowerCase();
  if(m.includes("row-level security")) return "No tienes permiso para editar este boleto.";
  if(m.includes("arranco")) return "Uno o más partidos ya arrancaron; esos no se guardaron.";
  if(m.includes("bloqueado")) return "Ese partido está bloqueado por el admin.";
  return "No se pudo guardar: "+m;
}

function conectarLgToggle(c){
  c.querySelectorAll(".sv-toggle button").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(LG.vista!==b.dataset.lv){ LG.vista=b.dataset.lv; renderLiguilla($("contenido")); }
    });

}
function conectarLgTickets(c){
  c.querySelectorAll("[data-ltk]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      if(LG.ticketSel===el.dataset.ltk) return;
      LG.ticketSel = el.dataset.ltk;
      await pantallaLiguilla($("contenido"));
    });
  });
}
function conectarLgBracket(c){
  // cuartos
  c.querySelectorAll("[data-cua]").forEach(el=>{
    if(el.classList.contains("dis")) return;
    el.addEventListener("click", ()=>{
      const slot = el.dataset.cua, eq = el.dataset.eq;
      LG.pred.cuartos[slot] = (LG.pred.cuartos[slot]===eq) ? null : eq;
      renderLiguilla($("contenido"));
    });
  });
  // semis (finalistas)
  c.querySelectorAll("[data-sem]").forEach(el=>{
    if(el.classList.contains("dis")) return;
    el.addEventListener("click", ()=>{
      const dslot = el.dataset.sem, eq = el.dataset.eq;
      LG.pred.semis[dslot] = (LG.pred.semis[dslot]===eq) ? null : eq;
      renderLiguilla($("contenido"));
    });
  });
  // campeón
  c.querySelectorAll("[data-camp]").forEach(el=>{
    if(el.classList.contains("dis")) return;
    el.addEventListener("click", ()=>{
      const eq = el.dataset.eq;
      LG.pred.campeon = (LG.pred.campeon===eq) ? null : eq;
      renderLiguilla($("contenido"));
    });
  });
  const g = $("lg-guardar");
  if(g) g.addEventListener("click", guardarBracket);
}

async function guardarBracket(){
  const g = $("lg-guardar"), msg = $("lg-msg");
  const semis = semisDerivadas();
  if(!semis || !LG.pred.semis[1] || !LG.pred.semis[2] || !LG.pred.campeon){
    msg.innerHTML = `<div class="sv-msg err">Completa cuartos, finalistas y campeón antes de guardar.</div>`; return;
  }
  g.disabled = true; g.textContent = "Guardando…"; msg.innerHTML = "";

  const cuartos = (LG.series.cuartos||[]).slice().sort((a,b)=>a.slot-b.slot);
  const filas = [];
  cuartos.forEach(s=>{
    filas.push({ torneo_id:LG.torneo.id, ticket_id:LG.ticketSel, ronda:'cuartos',
      slot:s.slot, equipo_pred_id:LG.pred.cuartos[s.slot], es_pick_campeon:false });
  });
  [1,2].forEach(dslot=>{
    filas.push({ torneo_id:LG.torneo.id, ticket_id:LG.ticketSel, ronda:'semis',
      slot:dslot, equipo_pred_id:LG.pred.semis[dslot], es_pick_campeon:false });
  });
  filas.push({ torneo_id:LG.torneo.id, ticket_id:LG.ticketSel, ronda:'final',
    slot:1, equipo_pred_id:LG.pred.campeon, es_pick_campeon:true });

  const { error } = await sb.from("liguilla_bracket")
    .upsert(filas, { onConflict:'ticket_id,ronda,slot' });
  if(error){
    msg.innerHTML = `<div class="sv-msg err">${escapa(traduceLiguilla(error.message))}</div>`;
    g.disabled = false; g.textContent = "Guardar mi bracket"; return;
  }
  msg.innerHTML = `<div class="sv-msg ok">¡Bracket guardado!</div>`;
  g.disabled = false; g.textContent = "Guardar mi bracket";
  setTimeout(()=>{ const m=msg.querySelector('.sv-msg'); if(m) m.remove(); }, 2500);
}

function traduceLiguilla(m){
  m = (m||"").toLowerCase();
  if(m.includes("row-level security")) return "No tienes permiso para editar este boleto.";
  if(m.includes("arranco") || m.includes("cerro") || m.includes("bloqueado")) return "El cuadro ya se congeló; no se puede editar.";
  return "No se pudo guardar: "+m;
}

// ---- vista El grupo: cuadro real + ranking ----
async function renderLiguillaGrupo(){
  const cont = $("lg-grupo"); if(!cont) return;
  let html = "";

  // 1) CUADRO REAL
  html += `<div class="grp-seccion"><h3>El cuadro</h3>`;
  const cuartos = LG.series.cuartos||[];
  if(cuartos.length===0){
    html += `<div class="grp-locked">El cuadro aún no está armado.</div>`;
  } else {
    ["cuartos","semis","final"].forEach(ronda=>{
      const arr = LG.series[ronda]||[];
      if(!arr.length) return;
      html += `<div class="lg-ronda-tit" style="margin-top:8px"><h3 style="font-size:15px">${RONDA_NOMBRE[ronda]}</h3></div>`;
      arr.forEach(s=>{
        const av = s.equipo_avanza_id;
        const aAv = av===s.equipo_a_id, bAv = av===s.equipo_b_id;
        const campeon = ronda==='final' && av;
        html += `<div class="lg-real-serie">
          <div class="par">
            <span class="${aAv?'avanza':''}" style="display:flex;align-items:center;gap:6px">${escudoMini(s.ea)}<span class="eqn">${escapa(s.ea?.nombre_corto||s.ea?.nombre||'—')}</span></span>
            <span class="vs">vs</span>
            <span class="${bAv?'avanza':''}" style="display:flex;align-items:center;gap:6px">${escudoMini(s.eb)}<span class="eqn">${escapa(s.eb?.nombre_corto||s.eb?.nombre||'—')}</span></span>
          </div>
          <div class="marca ${av?'ok':''}">${campeon?'★ campeón':(av?'avanza ✓':'pendiente')}</div>
        </div>`;
      });
    });
  }
  html += `</div>`;

  // 2) RANKING
  html += `<div class="grp-seccion"><h3>Ranking</h3>`;
  const { data: rank, error } = await sb.rpc("ranking_liguilla", { p_torneo_id: LG.torneo.id });
  if(error){
    html += `<div class="grp-locked">No se pudo cargar (${escapa(error.message)}).</div>`;
  } else if(!rank || rank.length===0){
    html += `<div class="grp-locked">Aún no hay puntos. Aparecen cuando empiezan los resultados.</div>`;
  } else {
    // nombres de dueños
    const { data: gtk } = await sb.from("liguilla_ticket")
      .select("usuario_id, duenio:usuario_id(nombre)").eq("torneo_id", LG.torneo.id);
    const nombres = {}; (gtk||[]).forEach(t=>{ if(t.usuario_id) nombres[t.usuario_id]=t.duenio?.nombre||'—'; });
    html += `<div class="lg-rank">
      <div class="lg-rank-head"><span class="c-pos">#</span><span class="c-nom">Boleto</span>
        <span class="c-tot">Tot</span><span class="c-a">A</span><span class="c-b">B</span></div>`;
    rank.forEach(f=>{
      const yo = nombres[f.usuario_id]!==undefined && f.usuario_id===perfil.id;
      html += `<div class="lg-rank-fila ${yo?'yo':''}">
        <span class="c-pos">${f.lugar}</span>
        <span class="c-nom"><div class="ap">${escapa(f.apodo)}${f.acerto_campeon?' <span style="color:var(--lima)">★</span>':''}</div>
          <div class="du">${escapa(nombres[f.usuario_id]||'—')}${yo?' · tú':''}</div></span>
        <span class="c-tot">${f.pts_total}</span>
        <span class="c-a">${f.pts_capa_a}</span>
        <span class="c-b">${f.pts_capa_b}</span>
      </div>`;
    });
    html += `</div>
      <div class="lg-hint" style="text-align:left;margin-top:8px">A = bracket (Capa A) · B = pronósticos por ronda (Capa B) · ★ = acertó campeón</div>`;
  }
  html += `</div>`;

  cont.innerHTML = html;
}

// ===================== TRADUCIR ERRORES =====================
function traduce(msg){
  if(!msg) return "Algo falló.";
  const m = msg.toLowerCase();
  if(m.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if(m.includes("already registered") || m.includes("already been registered")) return "Ese correo ya tiene cuenta. Inicia sesión.";
  if(m.includes("password should be at least")) return "La contraseña debe tener al menos 6 caracteres.";
  if(m.includes("unable to validate email") || m.includes("invalid email")) return "Ese correo no parece válido.";
  if(m.includes("email not confirmed")) return "Confirma tu correo antes de entrar.";
  return msg;
}
