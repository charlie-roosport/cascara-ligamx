    --cancha:#0B3D2E;      /* verde cancha profundo (fondo) */
    --cancha-2:#0F4E3A;    /* verde un paso más claro (tarjetas) */
    --hueso:#F2F4EF;       /* texto claro */
    --lima:#B6FF3C;        /* acento eléctrico: acciones, aciertos */
    --coral:#FF5A47;       /* fallos, alertas */
    --pizarra:#8A9490;     /* neutro */
    --linea:rgba(242,244,239,.12);
    --radio:14px;

  .cond{font-family:'Barlow Condensed',sans-serif}

  /* ---------- PANTALLA DE LOGIN ---------- */
  #auth{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:32px 24px;max-width:440px;width:100%;margin:0 auto;
  }
  .marca{margin-bottom:36px}
  .logo-roo{width:100%;max-width:340px;height:auto;display:block;margin-bottom:6px;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,.45))}
  .titulo-quiniela{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:30px;line-height:.98;margin-top:6px;color:var(--hueso);
  }
  .marca .kicker{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;
    letter-spacing:.04em;color:var(--lima);font-size:15px;
  }
  .marca h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:44px;line-height:.98;margin-top:2px;
  }
  .marca p{color:var(--pizarra);margin-top:10px;font-size:14px;line-height:1.5}

  /* Powered by Cáscara (socio tech) */
  .powered{display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:28px;color:var(--pizarra);font-size:13px;opacity:.9}
  .powered .logo-cascara-mini{height:60px;width:auto;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}

  /* franja Liga MX en login */
  .franja-liga{display:flex;align-items:center;gap:10px;margin-top:10px}
  .franja-liga-logo{height:40px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .franja-liga-txt{font-family:'Barlow Condensed',sans-serif;font-weight:700;
    font-size:24px;color:var(--hueso);line-height:1}

  /* logo Roo en la barra superior */
  .logo-roo-top{height:34px;width:auto;display:block;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}

  /* pie fijo de Cáscara (todas las pantallas post-login) */
  .pie-cascara{display:flex;align-items:center;justify-content:center;gap:8px;
    padding:8px 0;border-top:1px solid var(--linea);
    background:rgba(6,37,26,.55);backdrop-filter:blur(6px);
    color:var(--pizarra);font-size:11px}
  .pie-cascara img{height:34px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}

  /* pie de colaboración en Cuenta */
  .colab-pie{margin-top:28px;padding-top:20px;border-top:1px solid var(--linea);text-align:center}
  .colab-pie img{height:38px;width:auto;vertical-align:middle;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
  .colab-pie span{color:var(--pizarra);font-size:16px;margin:0 12px;vertical-align:middle}
  .colab-txt{color:var(--pizarra);font-size:11px;margin-top:10px}

  /* logo Liga MX junto al torneo (se muestra cuando exista el archivo) */
  .logo-liga{height:28px;width:auto;vertical-align:middle;margin-right:8px}

  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:13px;color:var(--pizarra);margin-bottom:6px}
  .campo input{
    width:100%;padding:14px;border-radius:var(--radio);
    background:rgba(15,78,58,.6);border:1px solid var(--linea);
    color:var(--hueso);font-size:16px;font-family:inherit;
  }
  .campo input:focus{outline:2px solid var(--lima);outline-offset:1px;border-color:transparent}

  .btn{
    width:100%;padding:15px;border-radius:var(--radio);border:none;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;
    letter-spacing:.02em;cursor:pointer;margin-top:8px;
  }
  .btn-primario{background:var(--lima);color:#06251A}
  .btn-primario:active{transform:translateY(1px)}
  .btn-fantasma{background:transparent;color:var(--hueso);border:1px solid var(--linea)}

  .cambia{margin-top:20px;text-align:center;font-size:14px;color:var(--pizarra)}
  .cambia button{background:none;border:none;color:var(--lima);font-weight:600;cursor:pointer;font-size:14px;font-family:inherit}

  .aviso{
    margin-top:16px;padding:12px 14px;border-radius:var(--radio);
    font-size:14px;line-height:1.4;display:none;
  }
  .aviso.error{background:rgba(255,90,71,.14);color:#FFB4A9;display:block}
  .aviso.ok{background:rgba(182,255,60,.14);color:var(--lima);display:block}

  /* ---------- APP (post-login) ---------- */
  #app{flex:1;display:none;flex-direction:column;min-height:100dvh}
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--linea);
    background:rgba(6,37,26,.55);backdrop-filter:blur(6px);
  }
  .top .wm{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
  .top .wm span{color:var(--lima)}
  .top .quien{font-size:13px;color:var(--pizarra);text-align:right}
  .top .quien button{display:block;background:none;border:none;color:var(--coral);font-size:12px;cursor:pointer;margin-top:2px;font-family:inherit}

  .contenido{flex:1;padding:20px;overflow-y:auto}
  .placeholder{
    border:1px dashed var(--linea);border-radius:var(--radio);
    padding:40px 20px;text-align:center;color:var(--pizarra);
  }
  .placeholder .cond{font-size:26px;color:var(--hueso);margin-bottom:6px}

  /* ---------- NAV INFERIOR ---------- */
  .tabs{
    display:flex;border-top:1px solid var(--linea);
    background:rgba(6,37,26,.72);backdrop-filter:blur(8px);position:sticky;bottom:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    flex:1;padding:12px 4px 14px;background:none;border:none;cursor:pointer;
    color:var(--pizarra);font-family:'Barlow Condensed',sans-serif;
    font-weight:600;font-size:13px;letter-spacing:.02em;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .tab .ic{width:22px;height:22px;display:block}
  .tab.activa{color:var(--lima)}

  .oculto{display:none!important}

  /* ---------- RESPONSIVE: en compu, marco centrado tipo teléfono ---------- */
  @media (min-width: 620px){
    /* fondo general oscuro; la cancha se acota al marco central */
    body{ background:#061A12; }
    body::before{
      left: 50%; transform: translateX(-50%);
      width: 460px; right: auto;
    }
    /* la app y el login se contienen en una columna central */
    #app, #auth{
      max-width: 460px;
      margin: 0 auto;
      width: 100%;
    }
    #app{
      min-height: 100dvh;
      border-left: 1px solid var(--linea);
      border-right: 1px solid var(--linea);
      box-shadow: 0 0 60px rgba(0,0,0,.35);
    }
    /* la nav inferior se ancla dentro del marco, no a todo el ancho */
    .tabs{
      max-width: 460px;
      margin: 0 auto;
      left: 0; right: 0;
    }
  }
  /* en pantallas muy anchas, un poco más de aire */
  @media (min-width: 1000px){
    #app{ box-shadow: 0 0 100px rgba(0,0,0,.5); }
  }

  /* ---------- CUENTA ---------- */
  .ct-cabecera{margin-bottom:20px}
  .ct-cabecera h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
  .ct-cabecera .sub{color:var(--pizarra);font-size:14px;margin-top:4px}
  .ct-bloque{
    background:rgba(15,78,58,.72);backdrop-filter:blur(2px);
    border:1px solid var(--linea);border-radius:var(--radio);
    padding:16px;margin-bottom:14px;
  }
  .ct-bloque h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;margin-bottom:4px}
  .ct-bloque .desc{color:var(--pizarra);font-size:13px;margin-bottom:12px;line-height:1.4}
  .ct-fila{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;border-top:1px solid var(--linea);
  }
  .ct-fila:first-of-type{border-top:none}
  .ct-fila .info{flex:1;min-width:0}
  .ct-fila .nom{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px}
  .ct-fila .meta{font-size:12px;color:var(--pizarra);margin-top:2px}
  .ct-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .ct-badge.pagado{background:rgba(182,255,60,.16);color:var(--lima)}
  .ct-badge.pend{background:rgba(255,180,60,.16);color:#FFC93C}
  .ct-badge.bloq{background:rgba(255,90,71,.16);color:#FF8A7A}
  .ct-btn{
    padding:10px 14px;border-radius:10px;border:none;cursor:pointer;white-space:nowrap;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
    background:var(--lima);color:#06251A;
  }
  .ct-btn.sec{background:transparent;color:var(--hueso);border:1px solid var(--linea)}
  .ct-btn:active{transform:translateY(1px)}
  .ct-btn:disabled{opacity:.4;cursor:default}
  .ct-vacio{color:var(--pizarra);font-size:13px;padding:6px 0}
  .ct-salir{margin-top:8px;width:100%;padding:13px;border-radius:var(--radio);
    background:transparent;border:1px solid rgba(255,90,71,.4);color:#FF8A7A;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px}

  /* ---------- ADMIN ---------- */
  .ad-h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;margin-bottom:2px}
  .ad-sub{color:var(--pizarra);font-size:13px;margin-bottom:18px}
  .ad-bloque{background:rgba(15,78,58,.72);backdrop-filter:blur(2px);
    border:1px solid var(--linea);border-radius:var(--radio);padding:16px;margin-bottom:14px}
  .ad-bloque h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;margin-bottom:4px}
  .ad-bloque .d{color:var(--pizarra);font-size:13px;margin-bottom:12px;line-height:1.4}
  .ad-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ad-btn{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;
    font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
    background:var(--lima);color:#06251A}
  .ad-btn.sec{background:transparent;color:var(--hueso);border:1px solid var(--linea)}
  .ad-btn:disabled{opacity:.5;cursor:default}
  .ad-btn:active{transform:translateY(1px)}
  .ad-inp{padding:9px 11px;border-radius:8px;background:rgba(6,37,26,.5);
    border:1px solid var(--linea);color:var(--hueso);font-size:14px;font-family:inherit;width:70px}
  .ad-log{margin-top:10px;font-size:12px;color:var(--pizarra);white-space:pre-wrap;
    background:rgba(6,37,26,.5);border-radius:8px;padding:10px;max-height:160px;overflow:auto;line-height:1.5}
  .ad-cargador{padding:12px 0;border-top:1px solid var(--linea)}
  .ad-cargador:first-of-type{border-top:none}
  .ad-carg-tit{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;margin-bottom:8px}
  .ad-carg-lbl{width:52px;font-size:13px;color:var(--pizarra)}
  .lg-leg-tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
    color:var(--lima);text-transform:uppercase;letter-spacing:.04em}
  .ad-fila{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linea)}
  .ad-fila:first-of-type{border-top:none}
  .ad-fila .info{flex:1;min-width:0}
  .ad-fila .n{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px}
  .ad-fila .m{font-size:11px;color:var(--pizarra)}
  .ad-mini{padding:6px 10px;border-radius:8px;border:none;cursor:pointer;font-size:12px;
    font-family:'Barlow Condensed',sans-serif;font-weight:600}
  .ad-mini.on{background:var(--lima);color:#06251A}
  .ad-mini.off{background:rgba(255,90,71,.18);color:#FF8A7A}

  /* ---------- SURVIVOR ---------- */

  .lg-rank{border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===================== CONFIG SUPABASE =====================
const SUPABASE_URL = "https://jusjfukucehsrtechmyw.supabase.co";
const SUPABASE_ANON = "sb_publishable_rmNfG7vbUpM385fE5-GaTw_fD29aww1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ===================== ESTADO =====================
let modoRegistro = false;
let perfil = null; // fila de la tabla usuario

// ===================== HELPERS UI =====================
const $ = (id) => document.getElementById(id);
function aviso(msg, tipo){
  const a = $("aviso-auth");
  a.textContent = msg;
  a.className = "aviso " + tipo;
}
function limpiaAviso(){ $("aviso-auth").className = "aviso"; }

// ===================== CAMBIO LOGIN/REGISTRO =====================
$("btn-cambia").addEventListener("click", () => {
  modoRegistro = !modoRegistro;
  limpiaAviso();
  $("campo-nombre").classList.toggle("oculto", !modoRegistro);
  $("btn-accion").textContent = modoRegistro ? "Crear cuenta" : "Entrar";
  $("txt-cambia").textContent = modoRegistro ? "¿Ya tienes cuenta?" : "¿No tienes cuenta?";
  $("btn-cambia").textContent = modoRegistro ? "Inicia sesión" : "Regístrate";
  $("clave").setAttribute("autocomplete", modoRegistro ? "new-password" : "current-password");
});

// ===================== ACCIÓN (entrar / registrar) =====================
$("btn-accion").addEventListener("click", async () => {
  const correo = $("correo").value.trim();
  const clave = $("clave").value;
  limpiaAviso();

  if(!correo || !clave){ aviso("Escribe tu correo y contraseña.", "error"); return; }

  $("btn-accion").disabled = true;
  $("btn-accion").textContent = modoRegistro ? "Creando…" : "Entrando…";

  try {
    if(modoRegistro){
      const nombre = $("nombre").value.trim();
      if(!nombre){ aviso("Ponle un nombre para que te vean los demás.", "error"); resetBtn(); return; }
      // 1. crear usuario en auth
      const { data, error } = await sb.auth.signUp({ email: correo, password: clave });
      if(error){ aviso(traduce(error.message), "error"); resetBtn(); return; }
      // 2. crear perfil en tabla usuario (si hay sesión inmediata)
      if(data.user){
        const { error: e2 } = await sb.from("usuario").insert({
          id: data.user.id, nombre: nombre, correo: correo
        });
        // si el proyecto exige confirmación por correo, puede no haber sesión aún
        if(e2 && !e2.message.includes("row-level security")){
          console.warn("perfil:", e2.message);
        }
      }
      if(!data.session){
        aviso("Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.", "ok");
        resetBtn(); return;
      }
      await entrar();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: correo, password: clave });
      if(error){ aviso(traduce(error.message), "error"); resetBtn(); return; }
      await entrar();
    }
  } catch(err){
    aviso("Algo falló. Inténtalo de nuevo.", "error");
    console.error(err); resetBtn();
  }
});

function resetBtn(){
  $("btn-accion").disabled = false;
  $("btn-accion").textContent = modoRegistro ? "Crear cuenta" : "Entrar";
}

// ===================== ENTRAR A LA APP =====================
async function entrar(){
  // asegurar perfil
  const { data: sesion } = await sb.auth.getUser();
  if(!sesion.user){ aviso("No se pudo iniciar sesión.", "error"); resetBtn(); return; }

  let { data: fila } = await sb.from("usuario").select("*").eq("id", sesion.user.id).maybeSingle();
  // si no hay perfil (p.ej. confirmó correo después), lo creamos con lo que haya
  if(!fila){
    const nombre = $("nombre").value.trim() || (sesion.user.email || "Jugador").split("@")[0];
    await sb.from("usuario").insert({ id: sesion.user.id, nombre, correo: sesion.user.email });
    const r = await sb.from("usuario").select("*").eq("id", sesion.user.id).maybeSingle();
    fila = r.data;
  }
  perfil = fila;
  $("mi-nombre").textContent = perfil ? perfil.nombre : "Jugador";
  // mostrar pestaña admin solo si el perfil es admin
  $("tab-admin").classList.toggle("oculto", !(perfil && perfil.es_admin));
  $("auth").style.display = "none";
  $("app").style.display = "flex";
  cambiaTab("survivor");
}

// ===================== SALIR =====================
$("btn-salir").addEventListener("click", async () => {
  await sb.auth.signOut();
  perfil = null;
  $("app").style.display = "none";
  $("auth").style.display = "flex";
  $("correo").value = ""; $("clave").value = "";
  resetBtn();
});

// ===================== PESTAÑAS =====================
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => cambiaTab(t.dataset.tab));
});
function cambiaTab(nombre){
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("activa", t.dataset.tab === nombre));
  const c = $("contenido");
  if(nombre === "survivor"){ pantallaSurvivor(c); return; }
  if(nombre === "quiniela"){ pantallaQuiniela(c); return; }
  if(nombre === "liguilla"){ pantallaLiguilla(c); return; }
  if(nombre === "cuenta"){ pantallaCuenta(c); return; }
  if(nombre === "admin"){ pantallaAdmin(c); return; }
}

// =====================================================================
//  PANTALLA SURVIVOR
// =====================================================================
const SV = { torneo:null, jornada:1, deadline:null, tickets:[], ticketSel:null,
             partidos:[], equiposUsados:{}, pickActual:null, eleccion:null,
             jornadaManual:null, jornadasDisponibles:[], deadlinesPorJornada:{},
             vista:'mis', listaUsados:[] };

const svgVida = (llena) => llena
  ? `<svg class="vida" viewBox="0 0 24 24" fill="#FF4D4D" stroke="#FF4D4D" stroke-width="2"><path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/></svg>`
  : `<svg class="vida" viewBox="0 0 24 24" fill="none" stroke="var(--pizarra)" stroke-width="2"><path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/></svg>`;

async function pantallaSurvivor(c){
  c.innerHTML = `<p style="color:var(--pizarra)">Cargando…</p>`;

  // 1. torneo activo
  if(!SV.torneo){
    const { data: tor } = await sb.from("torneo").select("*").eq("activo", true).maybeSingle();
    if(!tor){ c.innerHTML = `<div class="sv-vacio">Todavía no hay un torneo activo. El admin lo abre pronto.</div>`; return; }
    SV.torneo = tor;
  }

  // 2. jornada actual = la del deadline de survivor más próximo que no ha cerrado;
  //    si todos cerraron, la última.
  const { data: deadlines } = await sb.from("jornada_deadline")
    .select("*").eq("torneo_id", SV.torneo.id).order("jornada");
  if(!deadlines || deadlines.length === 0){
    c.innerHTML = `<div class="sv-vacio">Aún no hay jornadas de Survivor configuradas.</div>`; return;
  }
  const ahora = new Date();
  SV.jornadasDisponibles = deadlines.map(d => d.jornada);
  SV.deadlinesPorJornada = {};
  deadlines.forEach(d => SV.deadlinesPorJornada[d.jornada] = new Date(d.cierre_survivor));
  // si el usuario no ha elegido jornada manualmente, ir a la abierta (o la última)
  if(SV.jornadaManual == null){
    const abierta = deadlines.find(d => new Date(d.cierre_survivor) > ahora);
    const dl = abierta || deadlines[deadlines.length-1];
    SV.jornada = dl.jornada;
  } else {
    SV.jornada = SV.jornadaManual;
  }
  SV.deadline = SV.deadlinesPorJornada[SV.jornada];

  // 3. MIS boletos del torneo (solo los míos, no los del grupo)
  const { data: tickets } = await sb.from("survivor_ticket")
    .select("*").eq("torneo_id", SV.torneo.id).eq("usuario_id", perfil.id).order("creado_en");
  SV.tickets = tickets || [];
  if(!SV.ticketSel && SV.tickets.length) SV.ticketSel = SV.tickets.find(t=>!t.eliminado)?.id || SV.tickets[0].id;
  // si el boleto seleccionado ya no es mío (cambió de sesión), reseteo
  if(SV.ticketSel && !SV.tickets.find(t=>t.id===SV.ticketSel)){
    SV.ticketSel = SV.tickets.find(t=>!t.eliminado)?.id || SV.tickets[0]?.id || null;
  }

  // 4. partidos de la jornada
  const { data: parts } = await sb.from("partido")
    .select("id, jornada, kickoff, equipo_local_id, equipo_visitante_id, "+
            "loc:equipo_local_id(nombre,nombre_corto,escudo_url,color), vis:equipo_visitante_id(nombre,nombre_corto,escudo_url,color)")
    .eq("torneo_id", SV.torneo.id).eq("jornada", SV.jornada).order("kickoff");
  SV.partidos = parts || [];

  // 5. equipos ya usados por el ticket seleccionado + pick actual de esta jornada
  SV.equiposUsados = {};
  SV.listaUsados = [];   // para el panel: [{jornada, nombre, corto, escudo, color}]
  SV.pickActual = null;
  SV.eleccion = null;
  if(SV.ticketSel){
    const { data: usados } = await sb.from("survivor_pick")
      .select("equipo_id, jornada, partido_id, eq:equipo_id(nombre,nombre_corto,escudo_url,color)")
      .eq("ticket_id", SV.ticketSel).order("jornada");
    (usados||[]).forEach(u => {
      SV.equiposUsados[u.equipo_id] = u.jornada;
      if(u.eq) SV.listaUsados.push({ jornada:u.jornada, nombre:u.eq.nombre,
        nombre_corto:u.eq.nombre_corto, escudo_url:u.eq.escudo_url, color:u.eq.color });
      if(u.jornada === SV.jornada){ SV.pickActual = u; SV.eleccion = u.equipo_id; }
    });
  }

  // ¿el pick actual de esta jornada está en un partido que ya arrancó?
  // Si sí, el turno ya se consumió: se bloquea cambiar en toda la jornada.
  SV.pickConsumido = false;
  if(SV.pickActual){
    const pp = SV.partidos.find(x=>x.id === SV.pickActual.partido_id);
    if(pp && new Date(pp.kickoff) <= new Date()) SV.pickConsumido = true;
  }

  render(c);
}

function render(c){
  const cerrada = SV.deadline <= new Date();
  const t = SV.tickets.find(x=>x.id===SV.ticketSel);

  let html = `
  <div class="sv-cabecera">
    <h2>Survivor</h2>
    <div class="jornada">
      <img src="https://jusjfukucehsrtechmyw.supabase.co/storage/v1/object/public/marca/ligamx.svg?v=2"
           alt="Liga MX" class="logo-liga" onerror="this.style.display='none'">
      ${SV.torneo.nombre} · Jornada ${SV.jornada}
    </div>
    <div class="sv-reloj ${cerrada?'cerrado':''}">
      <span class="punto"></span><b id="sv-cuenta">${cerrada?'Jornada cerrada':textoReloj(SV.deadline)}</b>
    </div>
  </div>`;

  // navegador de jornadas
  const js = SV.jornadasDisponibles;
  const idx = js.indexOf(SV.jornada);
  const hayPrev = idx > 0, haySig = idx < js.length-1 && idx !== -1;
  const estadoJ = cerrada ? 'cerrada' : 'abierta';
  html += `
  <div class="sv-navj">
    <button id="j-prev" ${hayPrev?'':'disabled'}>‹</button>
    <div class="jinfo">Jornada ${SV.jornada}<small>${estadoJ}</small></div>
    <button id="j-sig" ${haySig?'':'disabled'}>›</button>
  </div>`;

  // toggle Mis picks / El grupo
  html += `
  <div class="sv-toggle">
    <button data-vista="mis" class="${SV.vista==='mis'?'activa':''}">Mis picks</button>
    <button data-vista="grupo" class="${SV.vista==='grupo'?'activa':''}">El grupo</button>
  </div>`;

  if(SV.vista === 'grupo'){
    html += `<div id="sv-grupo"><p style="color:var(--pizarra)">Cargando grupo…</p></div>`;
    c.innerHTML = html;
    conectarControles(c, cerrada);
    renderGrupo();
    return;
  }

  // carrusel de boletos
  html += `<div class="sv-tickets">`;
  SV.tickets.forEach(tk => {
    const vidas = Array.from({length: tk.vidas_iniciales}, (_,i)=> svgVida(i < tk.vidas)).join("");
    html += `
      <div class="sv-ticket ${tk.id===SV.ticketSel?'sel':''} ${tk.eliminado?'muerto':''}" data-ticket="${tk.id}">
        <div class="apodo">${escapa(tk.apodo)}</div>
        <div class="sv-vidas">${vidas}</div>
        ${tk.eliminado?'<div class="estado-muerto">Eliminado</div>':''}
      </div>`;
  });
  html += `</div>`;

  // panel de equipos ya usados por el boleto seleccionado
  if(SV.ticketSel){
    html += `<div class="sv-usados">
      <div class="titu">Equipos que ya usó este boleto</div>`;
    if(SV.listaUsados.length === 0){
      html += `<div class="nada">Ninguno todavía. Puedes elegir cualquier equipo.</div>`;
    } else {
      html += `<div class="tira">`;
      SV.listaUsados.forEach(u=>{
        const img = (u.escudo_url && String(u.escudo_url).startsWith('http'))
          ? `<img src="${u.escudo_url}" alt="${escapa(u.nombre)}">`
          : `<div class="mini-mono" style="background:${u.color||'#8A9490'}">${escapa(u.nombre_corto||'?')}</div>`;
        html += `<div class="sv-usado-item">${img}<div class="jlbl">J${u.jornada}</div></div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }

  html += `<div id="sv-zona"></div>`;
  c.innerHTML = html;

  c.innerHTML = html;
  conectarControles(c, cerrada);
  renderZona(cerrada, t);
  arrancaReloj();
}

// listeners compartidos por ambas vistas (mis picks / grupo)
function conectarControles(c, cerrada){
  // toggle de vista
  c.querySelectorAll(".sv-toggle button").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(SV.vista !== b.dataset.vista){ SV.vista = b.dataset.vista; render($("contenido")); }
    });
  });
  // selección de boleto
  c.querySelectorAll(".sv-ticket").forEach(el=>{
    el.addEventListener("click", async ()=>{
      SV.ticketSel = el.dataset.ticket;
      await pantallaSurvivor($("contenido"));
    });
  });
  // navegación de jornadas
  const jp = $("j-prev"), js2 = $("j-sig");
  if(jp) jp.addEventListener("click", async ()=>{
    const i = SV.jornadasDisponibles.indexOf(SV.jornada);
    if(i>0){ SV.jornadaManual = SV.jornadasDisponibles[i-1]; await pantallaSurvivor($("contenido")); }
  });
  if(js2) js2.addEventListener("click", async ()=>{
    const i = SV.jornadasDisponibles.indexOf(SV.jornada);
    if(i < SV.jornadasDisponibles.length-1){ SV.jornadaManual = SV.jornadasDisponibles[i+1]; await pantallaSurvivor($("contenido")); }
  });
}

// =====================================================================
//  VISTA DE GRUPO: tabla de vivos + picks del grupo (con candado)
// =====================================================================
async function renderGrupo(){
  const cont = $("sv-grupo");
  if(!cont) return;

  // 1. TABLA DE VIVOS: todos los boletos del torneo (RLS deja ver los básicos)
  const { data: tks } = await sb.from("survivor_ticket")
    .select("id, apodo, vidas, vidas_iniciales, eliminado, usuario_id, "+
            "duenio:usuario_id(nombre)")
    .eq("torneo_id", SV.torneo.id);
  // ordenar: vivos primero, por vidas desc; muertos al final
  const orden = (tks||[]).slice().sort((a,b)=>{
    if(a.eliminado !== b.eliminado) return a.eliminado ? 1 : -1;
    return b.vidas - a.vidas;
  });

  let html = `<div class="grp-seccion"><h3>Quién sigue vivo</h3>`;
  if(orden.length === 0){
    html += `<div class="grp-locked">Aún no hay boletos en el torneo.</div>`;
  } else {
    let pos = 0, ultVidas = null, ultElim = null;
    orden.forEach((tk, i)=>{
      // posición: mismo número si empatan en vidas y estado
      if(tk.vidas !== ultVidas || tk.eliminado !== ultElim){ pos = i+1; ultVidas = tk.vidas; ultElim = tk.eliminado; }
      const vidas = Array.from({length: tk.vidas_iniciales}, (_,k)=>
        `<span class="v">${svgVidaMini(k < tk.vidas)}</span>`).join("");
      html += `
      <div class="grp-fila ${tk.eliminado?'muerto':''}">
        <div class="grp-pos">${tk.eliminado?'—':pos}</div>
        <div class="quien">
          <div class="apodo">${escapa(tk.apodo)}</div>
          <div class="duenio">${escapa(tk.duenio?.nombre||'—')}</div>
        </div>
        ${tk.eliminado
          ? `<div class="elim">Eliminado${tk.eliminado_en_jornada?' J'+tk.eliminado_en_jornada:''}</div>`
          : `<div class="grp-vidas">${vidas}</div>`}
      </div>`;
    });
  }
  html += `</div>`;

  // 2. PICKS DEL GRUPO de la jornada actual (por partido, con candado)
  html += `<div class="grp-seccion"><h3>Picks de la jornada ${SV.jornada}</h3>`;
  // traer picks de survivor de esta jornada; la RLS oculta los de partidos no cerrados
  const partidoIds = SV.partidos.map(p=>p.id);
  let picksPorPartido = {};
  if(partidoIds.length){
    const { data: gpicks } = await sb.from("survivor_pick")
      .select("partido_id, equipo_id, ticket_id, resultado, "+
              "eq:equipo_id(nombre,nombre_corto,escudo_url,color), "+
              "tk:ticket_id(apodo)")
      .eq("jornada", SV.jornada).in("partido_id", partidoIds);
    (gpicks||[]).forEach(p=>{
      (picksPorPartido[p.partido_id] = picksPorPartido[p.partido_id] || []).push(p);
    });
  }

  // separar: partidos con picks (o aún con candado) van como tarjeta;
  // partidos ya cerrados donde nadie eligió van a un listado compacto aparte
  const sinPicks = [];
  SV.partidos.forEach(p=>{
    const cerrado = new Date(p.kickoff) <= new Date();
    const lista = picksPorPartido[p.id] || [];
    if(cerrado && lista.length === 0){ sinPicks.push(p); return; }

    const escLoc = escudoMini(p.loc), escVis = escudoMini(p.vis);
    html += `<div class="grp-partido">
      <div class="mt">${escLoc} ${escapa(p.loc.nombre_corto||p.loc.nombre)} <span style="color:var(--pizarra)">vs</span> ${escapa(p.vis.nombre_corto||p.vis.nombre)} ${escVis}</div>
      <div class="hr">${fechaHora(p.kickoff)}</div>`;
    if(!cerrado){
      html += `<div class="grp-locked"><span class="cand">🔒</span>Los picks se revelan cuando arranca el partido</div>`;
    } else {
      let cLoc=0, cVis=0;
      html += `<div class="grp-picks-lista">`;
      lista.forEach(pk=>{
        if(pk.equipo_id === p.equipo_local_id) cLoc++; else if(pk.equipo_id === p.equipo_visitante_id) cVis++;
        const clase = pk.resultado === 'ganado' ? 'gano' : (pk.resultado === 'perdido' ? 'perdio' : '');
        html += `<div class="grp-pick-chip ${clase}">${escudoMini(pk.eq)}<span class="eq">${escapa(pk.tk?.apodo||'—')}</span></div>`;
      });
      html += `</div>

        <span><b>${cLoc}</b> ${escapa(p.loc.nombre_corto||'L')}</span>
        <span><b>${cVis}</b> ${escapa(p.vis.nombre_corto||'V')}</span>

  // listado compacto de partidos que nadie eligió
  if(sinPicks.length){
    html += `<div class="grp-nadie"><div class="titu">Nadie eligió en estos partidos</div>`;
    sinPicks.forEach(p=>{
      html += `<div class="grp-nadie-fila">${escapa(p.loc.nombre_corto||p.loc.nombre)} <span>vs</span> ${escapa(p.vis.nombre_corto||p.vis.nombre)}</div>`;
    });

  }
  html += `</div>`;

  cont.innerHTML = html;
}

function renderZona(cerrada, t){
  const z = $("sv-zona");
  if(!z) return;
  if(SV.tickets.length === 0){
    z.innerHTML = `<div class="sv-vacio">Aún no tienes boletos de Survivor.<br><br>
      <button class="ct-btn" onclick="cambiaTab('cuenta')">Comprar un boleto en tu Cuenta</button></div>`;
    return;
  }
  if(t && t.eliminado){
    z.innerHTML = `<div class="sv-msg err">Este boleto ya quedó eliminado. Sus picks son solo de consulta.</div>`;
    return;
  }
  if(SV.partidos.length === 0){
    z.innerHTML = `<div class="sv-vacio">Todavía no hay partidos cargados para esta jornada.</div>`;
    return;
  }

  // pick ya consumido: su partido arrancó -> jornada bloqueada para este boleto
  const bloqueadoTurno = cerrada || SV.pickConsumido;

  let aviso = "";
  if(SV.pickConsumido){
    const eqPick = SV.listaUsados.find(u=>u.jornada===SV.jornada);
    aviso = `<div class="sv-msg ok">Tu pick de esta jornada${eqPick?` (<b>${escapa(eqPick.nombre)}</b>)`:''} ya está en un partido que arrancó. Quedó fijo, no puedes cambiarlo.</div>`;
  }

  let html = aviso + `<div class="sv-instru">Elige al equipo que crees que <b>gana</b>. No puedes repetir un equipo que ya usaste en este boleto. El empate te cuesta una vida.</div>`;

  SV.partidos.forEach(p=>{
    const arrancado = new Date(p.kickoff) <= new Date();  // partido ya empezó
    const usadoLoc = SV.equiposUsados[p.equipo_local_id] && SV.equiposUsados[p.equipo_local_id] !== SV.jornada;
    const usadoVis = SV.equiposUsados[p.equipo_visitante_id] && SV.equiposUsados[p.equipo_visitante_id] !== SV.jornada;
    const elLoc = SV.eleccion === p.equipo_local_id;
    const elVis = SV.eleccion === p.equipo_visitante_id;
    // un lado no es seleccionable si: equipo ya usado, el partido ya arrancó, o el turno está bloqueado
    const bloqLoc = usadoLoc || arrancado || bloqueadoTurno;
    const bloqVis = usadoVis || arrancado || bloqueadoTurno;
    html += `
    <div class="sv-partido ${arrancado?'arrancado':''}">
      <div class="hora">${fechaHora(p.kickoff)}</div>
      <div class="sv-cd ${arrancado?'cd-cerrado':''}" data-countdown="${p.kickoff}" data-prefijo="arranca en " data-cerrado-label="ya arrancó 🔒"></div>
      <div class="sv-lados">
        <div class="sv-lado ${elLoc?'elegido':''} ${bloqLoc?'usado':''}"
             data-eq="${p.equipo_local_id}" data-part="${p.id}" data-bloq="${bloqLoc?1:0}">
          ${escudoHTML(p.loc)}<div class="nom">${escapa(p.loc.nombre)}</div><div class="cl">local</div>
        </div>
        <div class="sv-vs">vs</div>
        <div class="sv-lado ${elVis?'elegido':''} ${bloqVis?'usado':''}"
             data-eq="${p.equipo_visitante_id}" data-part="${p.id}" data-bloq="${bloqVis?1:0}">
          ${escudoHTML(p.vis)}<div class="nom">${escapa(p.vis.nombre)}</div><div class="cl">visitante</div>
        </div>
      </div>
    </div>`;
  });

  html += `<button class="sv-guardar" id="sv-guardar" ${(!SV.eleccion||bloqueadoTurno)?'disabled':''}>
    ${cerrada?'Jornada cerrada':(SV.pickConsumido?'Pick fijo':(SV.pickActual?'Actualizar mi pick':'Guardar mi pick'))}
  </button>`;
  z.innerHTML = html;

  if(!bloqueadoTurno){
    z.querySelectorAll(".sv-lado").forEach(el=>{
      if(el.classList.contains("usado") || el.dataset.bloq==='1') return;
      el.addEventListener("click", ()=>{
        SV.eleccion = el.dataset.eq;
        SV.partidoElegido = el.dataset.part;
        renderZona(cerrada, t);
      });
    });
    const g = $("sv-guardar");
    if(g) g.addEventListener("click", guardarPick);
  }
  arrancaCountdowns();
}

async function guardarPick(){
  if(!SV.eleccion || !SV.partidoElegido){ return; }
  const g = $("sv-guardar"); g.disabled = true; g.textContent = "Guardando…";
  const payload = {
    ticket_id: SV.ticketSel, jornada: SV.jornada,
    partido_id: SV.partidoElegido, equipo_id: SV.eleccion
  };
  let error;
  if(SV.pickActual){
    ({ error } = await sb.from("survivor_pick").update(payload).eq("ticket_id", SV.ticketSel).eq("jornada", SV.jornada));
  } else {
    ({ error } = await sb.from("survivor_pick").insert(payload));
  }
  if(error){
    const z = $("sv-zona");
    const m = document.createElement("div");
    m.className = "sv-msg err";
    m.textContent = traduceSurvivor(error.message);
    z.prepend(m);
    g.disabled = false; g.textContent = SV.pickActual?'Actualizar mi pick':'Guardar mi pick';
    return;
  }
  await pantallaSurvivor($("contenido"));
  const z = $("sv-zona");
  const m = document.createElement("div");
  m.className = "sv-msg ok"; m.textContent = "¡Pick guardado!";
  z.prepend(m);
  setTimeout(()=>m.remove(), 2500);
}

function traduceSurvivor(msg){
  const m = (msg||"").toLowerCase();
  if(m.includes("survivor_pick_ticket_id_equipo_id")) return "Ya usaste ese equipo en este ticket. Elige otro.";
  if(m.includes("ya arrancó") || m.includes("ya cerró") || m.includes("cerro") || m.includes("arranco")) return "Ya cerró el tiempo para pickear esta jornada.";
  if(m.includes("adelantado")) return "Ese partido se adelantó y ya arrancó; el equipo ya no es seleccionable.";
  if(m.includes("row-level security")) return "No tienes permiso para editar este boleto.";
  return "No se pudo guardar: " + msg;
}

// ---- utilidades de tiempo/texto ----
let relojInt = null;
function arrancaReloj(){
  if(relojInt) clearInterval(relojInt);
  relojInt = setInterval(()=>{
    const el = $("sv-cuenta"); if(!el){ clearInterval(relojInt); return; }
    if(SV.deadline <= new Date()){ el.textContent = "Jornada cerrada"; clearInterval(relojInt); }
    else el.textContent = textoReloj(SV.deadline);
  }, 1000);
}
function textoReloj(fin){
  const ms = fin - new Date();
  if(ms <= 0) return "Jornada cerrada";
  const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000),
        m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  if(d>0) return `Cierra en ${d}d ${h}h ${m}m`;
  if(h>0) return `Cierra en ${h}h ${m}m ${s}s`;
  return `Cierra en ${m}m ${s}s`;
}
function fechaHora(iso){
  const f = new Date(iso);
  return f.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"}) +
    " · " + f.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
}

// ---- COUNTDOWN GENÉRICO POR PARTIDO ----
// Cualquier elemento con data-countdown="<ISO>" se actualiza cada segundo.
// Reutilizable en Survivor, Jornada y Liguilla.
function textoCuenta(ms){
  if(ms <= 0) return "";
  const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000),
        m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  if(d>0) return `${d}d ${h}h ${m}m`;
  if(h>0) return `${h}h ${m}m ${s}s`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}
let cdInt = null;
function arrancaCountdowns(){
  if(cdInt) clearInterval(cdInt);
  const tick = ()=>{
    const els = document.querySelectorAll("[data-countdown]");
    if(!els.length){ clearInterval(cdInt); cdInt=null; return; }
    const ahora = Date.now();
    els.forEach(el=>{
      const fin = new Date(el.dataset.countdown).getTime();
      const ms = fin - ahora;
      if(ms <= 0){
        el.textContent = el.dataset.cerradoLabel || "cerrado";
        el.classList.add("cd-cerrado");
      } else {
        el.textContent = (el.dataset.prefijo||"") + textoCuenta(ms);
        el.classList.remove("cd-cerrado");
      }
    });
  };
  tick();
  cdInt = setInterval(tick, 1000);
}
function escapa(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

// escudo del equipo: usa el logo subido a Storage; si no hay, monograma de color
function escudoHTML(eq){
  const mono = `<div class="sv-mono" style="background:${eq.color||'rgba(242,244,239,.1)'}">${escapa(eq.nombre_corto||'?')}</div>`;
  if(!eq.escudo_url || !String(eq.escudo_url).startsWith('http')) return mono;
  return `<img class="sv-escudo" src="${eq.escudo_url}" alt="${escapa(eq.nombre)}"
    onerror="this.outerHTML='<div class=\\'sv-mono\\' style=\\'background:${eq.color||'#8A9490'}\\'>${escapa(eq.nombre_corto||'?')}</div>'">`;
}

async function adResumenTorneo(){
  const cont = $("ad-resumen"); if(!cont) return;
  const { data: tor } = await sb.from("torneo").select("*").eq("activo",true).maybeSingle();
  if(!tor){ cont.textContent = "No hay torneo activo."; return; }
  const { count: nPart } = await sb.from("partido").select("*",{count:'exact',head:true}).eq("torneo_id",tor.id);
  const { data: js } = await sb.from("partido").select("jornada").eq("torneo_id",tor.id);
  const jornadas = new Set((js||[]).map(x=>x.jornada)).size;
  const { count: nDl } = await sb.from("jornada_deadline").select("*",{count:'exact',head:true}).eq("torneo_id",tor.id);
  cont.innerHTML = `<b style="color:var(--hueso)">${escapa(tor.nombre)}</b><br>
    Partidos cargados: ${nPart||0} · Jornadas: ${jornadas}<br>
    Jornadas con cierre de Survivor configurado: ${nDl||0}`;
}

// ---- SECCIÓN JUGADORES / PAGOS / BLOQUEOS ----
async function adJugadores(){
  const cont = $("ad-cont");
  cont.innerHTML = `<div class="ad-bloque"><h3>Boletos de Survivor</h3>
    <div class="d">Marca pagos, bloquea morosos, o marca cuentas de prueba.</div>
    <div id="ad-tickets">Cargando…</div></div>`;

  const { data: tor } = await sb.from("torneo").select("id").eq("activo",true).maybeSingle();
  const { data: tks } = await sb.from("survivor_ticket")
    .select("id, apodo, pagado, bloqueado, vidas, eliminado, usuario_id, duenio:usuario_id(nombre, es_prueba)")
    .eq("torneo_id", tor.id).order("creado_en");
  const box = $("ad-tickets");
  if(!tks || !tks.length){ box.innerHTML = `<div class="d">No hay boletos todavía.</div>`; return; }
  let html = "";
  tks.forEach(tk=>{
    html += `<div class="ad-fila">
      <div class="info">
        <div class="n">${escapa(tk.apodo)} ${tk.duenio?.es_prueba?'<span style="color:var(--pizarra)">(prueba)</span>':''}</div>
        <div class="m">${escapa(tk.duenio?.nombre||'—')} · ${tk.vidas} vidas${tk.eliminado?' · eliminado':''}</div>
      </div>
      <button class="ad-mini ${tk.pagado?'on':'gris'}" data-acc="pago" data-id="${tk.id}" data-val="${tk.pagado?1:0}">${tk.pagado?'pagado':'marcar pago'}</button>
      <button class="ad-mini ${tk.bloqueado?'off':'gris'}" data-acc="bloqueo" data-id="${tk.id}" data-val="${tk.bloqueado?1:0}">${tk.bloqueado?'bloqueado':'bloquear'}</button>
    </div>`;
  });
  box.innerHTML = html;
  box.querySelectorAll(".ad-mini").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const id=b.dataset.id, acc=b.dataset.acc, val = b.dataset.val==='1';
      const campo = acc==='pago' ? 'pagado' : 'bloqueado';
      const upd = { [campo]: !val };
      if(acc==='pago' && !val) upd.pagado_en = new Date().toISOString();
      const { error } = await sb.from("survivor_ticket").update(upd).eq("id", id);
      if(error){ alert("Error: "+error.message); return; }
      adJugadores();
    });
  });
}

// ---- SECCIÓN CIERRE DE JORNADA (Survivor) ----
async function adCierre(){
  const cont = $("ad-cont");
  const { data: tor } = await sb.from("torneo").select("id, nombre").eq("activo",true).maybeSingle();
  const { data: dls } = await sb.from("jornada_deadline").select("jornada, cierre_survivor, ajustado_manual").eq("torneo_id",tor.id).order("jornada");
  let opciones = (dls||[]).map(d=>`<option value="${d.jornada}">Jornada ${d.jornada}</option>`).join("");

  // filas para editar deadline a mano (formato datetime-local en hora local)
  const filasDl = (dls||[]).map(d=>{
    const dt = new Date(d.cierre_survivor);
    // datetime-local necesita YYYY-MM-DDTHH:MM en hora local
    const local = new Date(dt.getTime() - dt.getTimezoneOffset()*60000).toISOString().slice(0,16);
    return `<div class="ad-fila">
      <div class="info"><div class="n">Jornada ${d.jornada}</div>
        <div class="m">${d.ajustado_manual?'ajustado a mano':'automático'}</div></div>
      <input type="datetime-local" class="ad-inp" style="width:auto" value="${local}" data-j="${d.jornada}">
      <button class="ad-mini gris" data-guardar-dl="${d.jornada}">guardar</button>
    </div>`;
  }).join("");

  cont.innerHTML = `
  <div class="ad-bloque">
    <h3>Cerrar jornada de Survivor</h3>
    <div class="d">Descuenta vidas a los boletos según su pick (o falta de pick) en esa jornada. Es idempotente: correrlo dos veces no descuenta de más. Hazlo cuando ya todos los partidos de la jornada tengan resultado.</div>
    <div class="ad-row">
      <select class="ad-inp" id="ad-jcierre" style="width:auto">${opciones||'<option>—</option>'}</select>
      <button class="ad-btn" id="ad-cerrar">Cerrar jornada</button>
    </div>
    <div class="ad-log oculto" id="ad-log-cierre"></div>
  </div>
  <div class="ad-bloque">
    <h3>Ajustar cierre de Survivor por jornada</h3>
    <div class="d">Por default el cierre es 1h antes del primer partido de la jornada. Aquí lo puedes mover a mano. Un cierre ajustado a mano ya no se sobreescribe al reimportar el calendario.</div>
    ${filasDl || '<div class="d">No hay jornadas configuradas.</div>'}
  </div>`;

  const bc = $("ad-cerrar");
  if(bc) bc.addEventListener("click", async ()=>{
    const j = $("ad-jcierre").value;
    if(!j || j==='—') return;
    if(!confirm(`¿Cerrar la jornada ${j}? Esto descuenta vidas.`)) return;
    const log = $("ad-log-cierre"); log.classList.remove("oculto"); log.textContent = "Cerrando…";
    const { data, error } = await sb.rpc("cerrar_jornada_survivor", { p_torneo_id: tor.id, p_jornada: parseInt(j) });
    if(error){ log.textContent = "Error: "+error.message; return; }
    const filas = data||[];
    const perdieron = filas.filter(f=>f.perdio_vida).length;
    const elim = filas.filter(f=>f.eliminado).length;
    log.textContent = `Jornada ${j} cerrada ✓\nBoletos procesados: ${filas.length}\nPerdieron vida: ${perdieron}\nEliminados: ${elim}`;
  });

  // guardar deadline manual
  cont.querySelectorAll("[data-guardar-dl]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const j = parseInt(b.dataset.guardarDl);
      const inp = cont.querySelector(`input[data-j="${j}"]`);
      if(!inp || !inp.value) return;
      const iso = new Date(inp.value).toISOString();  // interpreta como hora local -> UTC
      b.textContent = "…";
      const { error } = await sb.from("jornada_deadline")
        .update({ cierre_survivor: iso, ajustado_manual: true })
        .eq("torneo_id", tor.id).eq("jornada", j);
      if(error){ alert("Error: "+error.message); b.textContent="guardar"; return; }
      adCierre();
    });
  });
}

// ##### INICIO MODALIDAD JORNADA+ACUMULADA #####
// =====================================================================
//  PANTALLA JORNADA + ACUMULADA  (modalidad jornada_acumulada)
// =====================================================================
const QN = { torneo:null, jornada:1, partidos:[], jornadasDisp:[],
             insc:null, misPicks:{}, misGoles:{}, totalJornada:null,
             vista:'picks', etapas:[], etapaSel:null, ranJornada:null };

async function pantallaQuiniela(c){
  c.innerHTML = `<p style="color:var(--pizarra)">Cargando…</p>`;

  // torneo activo
  if(!QN.torneo){
    const { data: tor } = await sb.from("torneo").select("*").eq("activo",true).maybeSingle();
    if(!tor){ c.innerHTML = `<div class="sv-vacio">Todavía no hay un torneo activo.</div>`; return; }
    QN.torneo = tor;
  }

  // ¿estoy inscrito? (para saber si puedo capturar)
  const { data: insc } = await sb.from("inscripcion")
    .select("*").eq("torneo_id",QN.torneo.id).eq("usuario_id",perfil.id)
    .eq("modalidad","jornada_acumulada").maybeSingle();
  QN.insc = insc || null;

  // jornadas disponibles = las que tienen partidos
  const { data: js } = await sb.from("partido").select("jornada")
    .eq("torneo_id",QN.torneo.id).order("jornada");
  QN.jornadasDisp = [...new Set((js||[]).map(x=>x.jornada))];
  if(QN.jornadasDisp.length===0){ c.innerHTML=`<div class="sv-vacio">Aún no hay partidos cargados.</div>`; return; }

  // jornada por default: la primera con algún partido sin arrancar; si todas arrancaron, la última
  if(!QN._jornadaTocada){
    const ahora = new Date();
    let elegida = null;
    for(const j of QN.jornadasDisp){
      const { data: pp } = await sb.from("partido").select("kickoff")
        .eq("torneo_id",QN.torneo.id).eq("jornada",j).order("kickoff").limit(1);
      if(pp && pp[0] && new Date(pp[0].kickoff) > ahora){ elegida = j; break; }
    }
    QN.jornada = elegida || QN.jornadasDisp[QN.jornadasDisp.length-1];
  }

  // partidos de la jornada
  const { data: parts } = await sb.from("partido")
    .select("id, jornada, kickoff, es_estrella, pospuesto, bloqueado_manual, goles_local, goles_visitante, status, equipo_local_id, equipo_visitante_id, "+
            "loc:equipo_local_id(nombre,nombre_corto,escudo_url,color), vis:equipo_visitante_id(nombre,nombre_corto,escudo_url,color)")
    .eq("torneo_id",QN.torneo.id).eq("jornada",QN.jornada).order("kickoff");
  QN.partidos = parts || [];

  // mis picks L/E/V de la jornada
  const pids = QN.partidos.map(p=>p.id);
  QN.misPicks = {}; QN.misGoles = {}; QN.totalJornada = null;
  if(pids.length){
    const { data: qp } = await sb.from("quiniela_pick")
      .select("partido_id, pronostico").eq("usuario_id",perfil.id)
      .eq("torneo_id",QN.torneo.id).in("partido_id",pids);
    (qp||[]).forEach(r=> QN.misPicks[r.partido_id]=r.pronostico);
  }
  // mis goles de estrellas + total de jornada (tiebreaker tipo jornada)
  const { data: tb } = await sb.from("tiebreaker_pick")
    .select("partido_id, pred_goles_totales").eq("usuario_id",perfil.id)
    .eq("torneo_id",QN.torneo.id).eq("tipo","jornada").eq("jornada",QN.jornada);
  (tb||[]).forEach(r=>{
    if(r.partido_id) QN.misGoles[r.partido_id]=r.pred_goles_totales;
    else QN.totalJornada = r.pred_goles_totales;
  });

  renderQuiniela(c);
}

function renderQuiniela(c){
  let html = `
  <div class="sv-cabecera">
    <h2>Jornada</h2>
    <div class="jornada">
      <img src="https://jusjfukucehsrtechmyw.supabase.co/storage/v1/object/public/marca/ligamx.svg?v=2"
           alt="Liga MX" class="logo-liga" onerror="this.style.display='none'">
      ${escapa(QN.torneo.nombre)} · Jornada ${QN.jornada}
    </div>
  </div>`;

  // navegador de jornadas
  const idx = QN.jornadasDisp.indexOf(QN.jornada);
  html += `
  <div class="sv-navj">
    <button id="qn-prev" ${idx>0?'':'disabled'}>‹</button>
    <div class="jinfo">Jornada ${QN.jornada}<small>${QN.partidos.length} partidos</small></div>
    <button id="qn-sig" ${idx<QN.jornadasDisp.length-1?'':'disabled'}>›</button>
  </div>`;

  // toggle Picks / Tabla
  html += `
  <div class="sv-toggle">
    <button data-qv="picks" class="${QN.vista==='picks'?'activa':''}">Mis picks</button>
    <button data-qv="tabla" class="${QN.vista==='tabla'?'activa':''}">Tablas</button>
  </div>`;

  if(QN.vista==='tabla'){
    html += `<div id="qn-tabla"><p style="color:var(--pizarra)">Cargando tabla…</p></div>`;
    c.innerHTML = html;
    conectarQnControles(c);
    renderTablas();
    return;
  }

  // Vista de captura
  if(!QN.insc){
    html += `<div class="sv-vacio">No estás inscrito en Jornada + Acumulada.<br><br>
      <button class="ct-btn" onclick="cambiaTab('cuenta')">Inscribirme en Cuenta</button></div>`;
    c.innerHTML = html; conectarQnControles(c); return;
  }
  if(QN.insc.bloqueado){
    html += `<div class="sv-msg err">Tu inscripción está bloqueada por pago pendiente. Ponte al corriente para capturar.</div>`;
  }
  if(QN.partidos.length===0){
    html += `<div class="sv-vacio">No hay partidos en esta jornada.</div>`;
    c.innerHTML = html; conectarQnControles(c); return;
  }

  const bloqueado = QN.insc.bloqueado;
  html += `<div class="qn-instru">Pronostica <b>L / E / V</b> por partido. En los <span class="qn-estrella-lbl">★ estrella</span> también atina el <b>total de goles</b> para el punto extra. Cada partido cierra en su kickoff.</div>`;

  html += `<div id="qn-lista">`;
  QN.partidos.forEach(p=>{
    html += filaPartidoQuiniela(p, bloqueado);
  });
  html += `</div>`;

  // total de la jornada (desempate)
  html += `
  <div class="qn-total">
    <div class="qn-total-lbl">Total de goles de <b>toda la jornada</b> <span class="qn-hint">(desempate)</span></div>
    <input type="number" min="0" max="99" id="qn-total-input" class="qn-num-big"
      value="${QN.totalJornada??''}" ${bloqueado?'disabled':''} placeholder="—">
  </div>`;

  html += `<button class="sv-guardar" id="qn-guardar" ${bloqueado?'disabled':''}>Guardar mis picks</button>`;
  html += `<div id="qn-msg"></div>`;

  c.innerHTML = html;
  conectarQnControles(c);
  conectarCapturaQuiniela(c);
  arrancaCountdowns();
}

function filaPartidoQuiniela(p, bloqueado){
  const arrancado = new Date(p.kickoff) <= new Date();
  const cerrado = arrancado || p.pospuesto || p.bloqueado_manual;
  const pick = QN.misPicks[p.id] || null;
  const escL = escudoMini(p.loc), escV = escudoMini(p.vis);
  const estrella = p.es_estrella;

  let estado = '';
  if(p.pospuesto) estado = `<span class="qn-flag posp">pospuesto</span>`;
  else if(p.bloqueado_manual) estado = `<span class="qn-flag posp">bloqueado</span>`;

  let botones = '';
  ['L','E','V'].forEach(op=>{
    const sel = pick===op;
    const dis = cerrado || bloqueado;
    botones += `<button class="qn-lev ${sel?'sel':''}" data-lev="${op}" data-part="${p.id}" ${dis?'disabled':''}>${op}</button>`;
  });

  // input de goles solo si es estrella
  let golesInput = '';
  if(estrella){
    const val = QN.misGoles[p.id];
    golesInput = `
    <div class="qn-goles">
      <span class="qn-goles-lbl">★ goles totales del partido</span>
      <input type="number" min="0" max="20" class="qn-num" data-goles="${p.id}"
        value="${val??''}" ${cerrado||bloqueado?'disabled':''} placeholder="—">
    </div>`;
  }

  return `
  <div class="qn-partido ${estrella?'es-estrella':''} ${cerrado?'cerrado':''}">
    <div class="qn-part-top">
      ${estrella?'<span class="qn-star">★ ESTRELLA</span>':''}
      ${estado}
      <span class="qn-cd" data-countdown="${p.kickoff}" data-prefijo="cierra en " data-cerrado-label="cerrado 🔒"></span>
    </div>
    <div class="qn-matchup">
      <div class="qn-eq">${escL}<span>${escapa(p.loc.nombre_corto||p.loc.nombre)}</span></div>
      <div class="qn-lev-box">${botones}</div>
      <div class="qn-eq">${escV}<span>${escapa(p.vis.nombre_corto||p.vis.nombre)}</span></div>
    </div>
    ${golesInput}
  </div>`;
}

function conectarQnControles(c){
  c.querySelectorAll(".sv-toggle button").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(QN.vista!==b.dataset.qv){ QN.vista=b.dataset.qv; renderQuiniela($("contenido")); }
    });
  });
  const pv=$("qn-prev"), sg=$("qn-sig");
  if(pv) pv.addEventListener("click", async ()=>{
    const i=QN.jornadasDisp.indexOf(QN.jornada);
    if(i>0){ QN.jornada=QN.jornadasDisp[i-1]; QN._jornadaTocada=true; await pantallaQuiniela($("contenido")); }
  });
  if(sg) sg.addEventListener("click", async ()=>{
    const i=QN.jornadasDisp.indexOf(QN.jornada);
    if(i<QN.jornadasDisp.length-1){ QN.jornada=QN.jornadasDisp[i+1]; QN._jornadaTocada=true; await pantallaQuiniela($("contenido")); }
  });
}

function conectarCapturaQuiniela(c){
  // botones L/E/V
  c.querySelectorAll(".qn-lev").forEach(b=>{
    b.addEventListener("click", ()=>{
      const pid=b.dataset.part, op=b.dataset.lev;
      QN.misPicks[pid] = (QN.misPicks[pid]===op) ? null : op;
      // repintar solo ese grupo
      c.querySelectorAll(`.qn-lev[data-part="${pid}"]`).forEach(x=>
        x.classList.toggle("sel", x.dataset.lev===QN.misPicks[pid]));
    });
  });
  // inputs de goles de estrella
  c.querySelectorAll("[data-goles]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const v=inp.value.trim();
      QN.misGoles[inp.dataset.goles] = v===''?undefined:parseInt(v);
    });
  });
  // total de jornada
  const ti=$("qn-total-input");
  if(ti) ti.addEventListener("input", ()=>{
    const v=ti.value.trim(); QN.totalJornada = v===''?null:parseInt(v);
  });
  const g=$("qn-guardar");
  if(g) g.addEventListener("click", guardarQuiniela);
}

async function guardarQuiniela(){
  const g=$("qn-guardar"); const msg=$("qn-msg");
  g.disabled=true; g.textContent="Guardando…"; msg.innerHTML="";

  // Solo tocamos partidos NO cerrados; los cerrados la BD los rechaza igual.
  const ahora = new Date();
  const abiertos = QN.partidos.filter(p =>
    !(new Date(p.kickoff)<=ahora || p.pospuesto || p.bloqueado_manual));
  const idsAbiertos = abiertos.map(p=>p.id);

  const picksLev = [];
  const golesEstrella = [];
  abiertos.forEach(p=>{
    if(QN.misPicks[p.id]){
      picksLev.push({ torneo_id:QN.torneo.id, usuario_id:perfil.id,
        partido_id:p.id, pronostico:QN.misPicks[p.id] });
    }
    const gv = QN.misGoles[p.id];
    if(p.es_estrella && gv!==undefined && gv!==null && !isNaN(gv)){
      golesEstrella.push({ torneo_id:QN.torneo.id, usuario_id:perfil.id,
        tipo:'jornada', jornada:QN.jornada, partido_id:p.id, pred_goles_totales:gv });
    }
  });

  try{
    // --- L/E/V: upsert por (usuario,partido) que SÍ tiene unique constraint ---
    if(picksLev.length){
      const { error } = await sb.from("quiniela_pick")
        .upsert(picksLev, { onConflict:'usuario_id,partido_id' });
      if(error) throw error;
    }
    // --- Goles de estrella: borrar los de partidos abiertos de esta jornada y reinsertar ---
    if(idsAbiertos.length){
      const { error: eDel } = await sb.from("tiebreaker_pick").delete()
        .eq("usuario_id",perfil.id).eq("torneo_id",QN.torneo.id)
        .eq("tipo","jornada").in("partido_id", idsAbiertos);
      if(eDel) throw eDel;
    }
    if(golesEstrella.length){
      const { error } = await sb.from("tiebreaker_pick").insert(golesEstrella);
      if(error) throw error;
    }
    // --- Total de jornada (partido_id null): borrar el previo y reinsertar si hay valor ---
    if(QN.totalJornada!==null && !isNaN(QN.totalJornada)){
      await sb.from("tiebreaker_pick").delete()
        .eq("usuario_id",perfil.id).eq("torneo_id",QN.torneo.id)
        .eq("tipo","jornada").eq("jornada",QN.jornada).is("partido_id", null);
      const { error } = await sb.from("tiebreaker_pick").insert({
        torneo_id:QN.torneo.id, usuario_id:perfil.id, tipo:'jornada',
        jornada:QN.jornada, partido_id:null, pred_goles_totales:QN.totalJornada });
      if(error) throw error;
    }
    msg.innerHTML = `<div class="sv-msg ok">¡Picks guardados!</div>`;
    setTimeout(()=>{ const m=msg.querySelector('.sv-msg'); if(m) m.remove(); }, 2500);
  }catch(e){
    msg.innerHTML = `<div class="sv-msg err">${escapa(traduceQuiniela(e.message||String(e)))}</div>`;
  }
  g.disabled=false; g.textContent="Guardar mis picks";
}

function traduceQuiniela(m){
  m=(m||"").toLowerCase();
  if(m.includes("ya arranco")) return "Uno o más partidos ya arrancaron; esos no se guardaron.";
  if(m.includes("pospuesto")) return "Hay un partido pospuesto; ese no se guardó.";
  if(m.includes("bloqueado")||m.includes("inscrito")) return "Tu inscripción está bloqueada o no estás inscrito.";
  if(m.includes("row-level security")) return "No tienes permiso para guardar estos picks.";
  return "No se pudo guardar: "+m;
}

// ---------- TABLAS (semanal + acumulada) ----------
async function renderTablas(){
  const cont=$("qn-tabla"); if(!cont) return;
  let html = '';

  // --- SEMANAL de la jornada actual ---
  const { data: rj, error: e1 } = await sb.rpc("ranking_jornada",
    { p_torneo_id:QN.torneo.id, p_jornada:QN.jornada });
  html += `<div class="grp-seccion"><h3>Tabla semanal · Jornada ${QN.jornada}</h3>`;
  if(e1){ html += `<div class="grp-locked">No se pudo cargar (${escapa(e1.message)}).</div>`; }
  else if(!rj || rj.length===0){ html += `<div class="grp-locked">Aún no hay puntos en esta jornada.</div>`; }
  else { html += tablaRanking(rj, 'jornada'); }
  html += `</div>`;

  // --- ACUMULADA: selector de etapa ---
  if(QN.etapas.length===0){
    const { data: et } = await sb.from("etapa_acumulada")
      .select("*").eq("torneo_id",QN.torneo.id).order("orden");
    QN.etapas = et || [];
    if(QN.etapas.length && !QN.etapaSel) QN.etapaSel = QN.etapas[0].id;
  }
  html += `<div class="grp-seccion"><h3>Acumulada</h3>`;
  if(QN.etapas.length===0){
    html += `<div class="grp-locked">La acumulada aún no tiene etapas configuradas.</div>`;
  } else {
    html += `<select class="ad-inp" id="qn-etapa" style="width:auto;margin-bottom:10px">`;
    QN.etapas.forEach(e=>{
      html += `<option value="${e.id}" ${e.id===QN.etapaSel?'selected':''}>${escapa(e.nombre)} (J${e.jornada_desde}-${e.jornada_hasta})</option>`;
    });
    html += `</select><div id="qn-acum-tabla"><p style="color:var(--pizarra)">Cargando…</p></div>`;
  }
  html += `</div>`;

  cont.innerHTML = html;

  const sel=$("qn-etapa");
  if(sel){
    sel.addEventListener("change", ()=>{ QN.etapaSel=sel.value; cargarAcumulada(); });
    cargarAcumulada();
  }
}

async function cargarAcumulada(){
  const box=$("qn-acum-tabla"); if(!box) return;
  const { data: ra, error } = await sb.rpc("ranking_acumulada",
    { p_torneo_id:QN.torneo.id, p_etapa_id:QN.etapaSel });
  if(error){ box.innerHTML=`<div class="grp-locked">No se pudo cargar (${escapa(error.message)}).</div>`; return; }
  if(!ra || ra.length===0){ box.innerHTML=`<div class="grp-locked">Aún no hay puntos en esta etapa.</div>`; return; }
  box.innerHTML = tablaRanking(ra, 'acum');
}

function tablaRanking(filas, modo){
  let html = `<div class="qn-rank">
    <div class="qn-rank-head">
      <span class="c-pos">#</span><span class="c-nom">Jugador</span>
      <span class="c-pts">Pts</span><span class="c-des">Desempate</span>
    </div>`;
  const yo = perfil.id;
  filas.forEach(f=>{
    const soyYo = f.usuario_id===yo;
    let des;
    if(modo==='jornada'){
      des = `★${f.goles_estrella_ok} · dif ${f.dif_goles_jornada??'—'}`;
    } else {
      des = `★${f.goles_estrella_ok} · Σdif ${f.suma_dif_goles??'—'}`;
    }
    html += `<div class="qn-rank-fila ${soyYo?'yo':''}">
      <span class="c-pos">${f.pos}</span>
      <span class="c-nom">${escapa(f.nombre)}${soyYo?' <b>(tú)</b>':''}</span>
      <span class="c-pts">${f.puntos}</span>
      <span class="c-des">${des}</span>
    </div>`;
  });
  html += `</div>`;
  return html;
}

async function crearEtapa(){
  const tor=AD._torJ;
  const nombre=$("et-nombre").value.trim();
  const desde=parseInt($("et-desde").value), hasta=parseInt($("et-hasta").value);
  const log=$("ad-log-et");
  if(!nombre || isNaN(desde) || isNaN(hasta)){ log.classList.remove("oculto"); log.textContent="Llena nombre, desde y hasta."; return; }
  if(desde>hasta){ log.classList.remove("oculto"); log.textContent="'Desde' no puede ser mayor que 'hasta'."; return; }
  // orden = cantidad actual
  const { count } = await sb.from("etapa_acumulada").select("*",{count:'exact',head:true}).eq("torneo_id",tor.id);
  const { error } = await sb.from("etapa_acumulada").insert({
    torneo_id:tor.id, nombre, jornada_desde:desde, jornada_hasta:hasta, orden:(count||0)
  });
  if(error){ log.classList.remove("oculto"); log.textContent="Error: "+error.message; return; }
  $("et-nombre").value=""; $("et-desde").value=""; $("et-hasta").value="";
  log.classList.add("oculto");
  adEtapas();
}

// =====================================================================
//  ADMIN · LIGUILLA (armar cuadro + marcar avances + boletos)
// =====================================================================
const RONDA_NOMBRE = { cuartos:'Cuartos', semis:'Semifinales', final:'Final' };

// carga las series del torneo agrupadas por ronda (con nombres de equipo)
async function cargarSeriesLiguilla(torneoId){
  const { data: rows } = await sb.from("liguilla_serie")
    .select("id, ronda, slot, seed_a, seed_b, equipo_a_id, equipo_b_id, equipo_avanza_id, es_campeon_serie, "+
            "ea:equipo_a_id(nombre,nombre_corto,escudo_url,color), "+
            "eb:equipo_b_id(nombre,nombre_corto,escudo_url,color)")
    .eq("torneo_id", torneoId).order("ronda").order("slot");
  const g = { cuartos:[], semis:[], final:[] };
  (rows||[]).forEach(r=>{ (g[r.ronda] = g[r.ronda]||[]).push(r); });
  return g;
}

async function adLiguilla(){
  const cont = $("ad-cont");
  const { data: tor } = await sb.from("torneo").select("id,nombre").eq("activo",true).maybeSingle();
  if(!tor){ cont.innerHTML=`<div class="ad-bloque">No hay torneo activo.</div>`; return; }
  AD._torL = tor;
  cont.innerHTML = `<div class="ad-bloque"><div class="d">Cargando cuadro…</div></div>`;

  const series = await cargarSeriesLiguilla(tor.id);
  const cuartos = series.cuartos || [];
  const hayResultados = cuartos.some(s=>s.equipo_avanza_id);

  let html = "";

  // ---- 1) ARMAR CUARTOS ----
  if(cuartos.length === 0){
    const { data: eqs } = await sb.from("equipo").select("id,nombre").eq("activo",true).order("nombre");
    const opciones = (eqs||[]).map(e=>`<option value="${e.id}">${escapa(e.nombre)}</option>`).join("");
    let selects = "";
    for(let s=1;s<=8;s++){
      selects += `<div class="ad-row" style="gap:8px">
        <span style="width:64px;font-size:13px;color:var(--pizarra)">Seed ${s}</span>
        <select class="ad-inp" data-seed="${s}" style="flex:1"><option value="">— elige —</option>${opciones}</select>
      </div>`;
    }
    html += `
    <div class="ad-bloque">
      <h3>Armar cuadro de cuartos</h3>
      <div class="d">Carga los 8 equipos <b>en orden de seed 1 al 8</b> (la tabla general la pones tú; la API no la da). El sistema arma solo los cruces 1v8, 2v7, 3v6, 4v5. Semis y final se siembran solas conforme marques quién avanza.</div>
      ${selects}
      <button class="ad-btn" id="lg-armar" style="margin-top:6px">Armar cuadro</button>
      <div class="ad-log oculto" id="lg-log-armar"></div>
    </div>`;
  } else {
    // resumen + opción de rearmar (solo si aún no hay resultados)
    html += `
    <div class="ad-bloque">
      <h3>Cuadro armado</h3>
      <div class="d">El cuadro de cuartos ya está cargado.${hayResultados
        ? ' Ya hay avances marcados, así que no se puede rearmar.'
        : ' Aún no marcas avances; puedes borrarlo y rearmarlo si te equivocaste.'}</div>
      ${hayResultados ? '' : `<button class="ad-btn off" id="lg-rearmar">Borrar y rearmar cuadro</button>`}
    </div>`;
  }

  // ---- 2) MARCAR AVANCES (por ronda) ----
  if(cuartos.length){
    html += `<div class="ad-bloque"><h3>Marcar quién avanza</h3>
      <div class="d">Toca al equipo que pasa en cada serie. Al marcar cuartos completos, las semis aparecen solas (mejor seed vivo vs peor); igual la final. La Capa A de los jugadores se recalcula sola.</div>`;
    ["cuartos","semis","final"].forEach(ronda=>{
      const arr = series[ronda]||[];
      if(!arr.length) return;
      html += `<div style="margin-top:12px"><div class="lg-ronda-tit"><h3 style="font-size:16px">${RONDA_NOMBRE[ronda]}</h3></div>`;
      arr.forEach(s=>{
        const listo = !!s.equipo_avanza_id;
        const aSel = s.equipo_avanza_id===s.equipo_a_id, bSel = s.equipo_avanza_id===s.equipo_b_id;
        html += `<div class="lg-serie ${(!s.equipo_a_id||!s.equipo_b_id)?'pend':''}">
          <div class="lg-lados">
            <div class="lg-lado ${aSel?'sel':''}" data-avanza="${s.id}" data-eq="${s.equipo_a_id||''}">
              <span class="seed">${s.seed_a??'?'}</span>${escudoMini(s.ea)}<span class="nom">${escapa(s.ea?.nombre_corto||s.ea?.nombre||'por definir')}</span>
            </div>
            <div class="lg-vs">vs</div>
            <div class="lg-lado ${bSel?'sel':''}" data-avanza="${s.id}" data-eq="${s.equipo_b_id||''}">
              <span class="seed">${s.seed_b??'?'}</span>${escudoMini(s.eb)}<span class="nom">${escapa(s.eb?.nombre_corto||s.eb?.nombre||'por definir')}</span>
            </div>
          </div>
          ${listo?'':'<div class="lg-hint">sin marcar</div>'}
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  // ---- 2.5) CARGAR PARTIDOS (ida/vuelta por serie) ----
  let partidosLig = [];
  if(cuartos.length){
    const { data: pl } = await sb.from("partido")
      .select("id, jornada, kickoff, goles_local, goles_visitante, equipo_local_id, equipo_visitante_id")
      .eq("torneo_id", tor.id).gt("jornada", 17).order("kickoff");
    partidosLig = pl || [];
    html += renderAdCargador(series, partidosLig);
  }

  // ---- 3) BOLETOS DE LIGUILLA (pago/bloqueo) ----
  html += `<div class="ad-bloque"><h3>Boletos de Liguilla</h3>
    <div class="d">Marca pagos o bloquea morosos. Un boleto bloqueado queda fuera del ranking.</div>
    <div id="lg-ad-tickets">Cargando…</div></div>`;

  cont.innerHTML = html;

  // --- eventos: armar ---
  const bArmar = $("lg-armar");
  if(bArmar) bArmar.addEventListener("click", async ()=>{
    const ids = [];
    cont.querySelectorAll("[data-seed]").forEach(sel=> ids[parseInt(sel.dataset.seed)-1] = sel.value || null);
    const log = $("lg-log-armar"); log.classList.remove("oculto");
    if(ids.some(x=>!x)){ log.textContent = "Faltan equipos: llena los 8 seeds."; return; }
    if(new Set(ids).size !== 8){ log.textContent = "Hay equipos repetidos: cada seed debe ser distinto."; return; }
    bArmar.disabled = true; log.textContent = "Armando cuadro…";
    const { error } = await sb.rpc("armar_cuartos_liguilla", { p_torneo_id: AD._torL.id, p_equipos: ids });
    if(error){ log.textContent = "Error: "+error.message; bArmar.disabled=false; return; }
    adLiguilla();
  });

  // --- eventos: rearmar (borra series sin resultados) ---
  const bRe = $("lg-rearmar");
  if(bRe) bRe.addEventListener("click", async ()=>{
    if(!confirm("¿Borrar el cuadro actual y volver a armarlo? Solo se puede si nadie ha avanzado aún.")) return;
    const { error } = await sb.from("liguilla_serie").delete().eq("torneo_id", AD._torL.id);
    if(error){ alert("No se pudo borrar: "+error.message); return; }
    adLiguilla();
  });

  // --- eventos: marcar avance ---
  cont.querySelectorAll("[data-avanza]").forEach(el=>{
    el.addEventListener("click", async ()=>{
      const serieId = el.dataset.avanza, eqId = el.dataset.eq;
      if(!eqId) return;
      el.style.opacity = ".5";
      const { error } = await sb.from("liguilla_serie").update({ equipo_avanza_id: eqId }).eq("id", serieId);
      if(error){ alert("Error: "+error.message); adLiguilla(); return; }
      adLiguilla(); // recarga: el trigger ya resembró semis/final y recalculó Capa A
    });
  });

  // --- eventos: cargar/actualizar partidos ida/vuelta ---
  cont.querySelectorAll("[data-carg]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const serieId = btn.dataset.carg;
      const box = cont.querySelector(`.ad-cargador[data-serie="${serieId}"]`);
      const log = cont.querySelector(`[data-carglog="${serieId}"]`);
      log.classList.remove("oculto");
      const ida = box.querySelector('[data-ko="ida"]').value;
      const vue = box.querySelector('[data-ko="vuelta"]').value;
      if(!ida || !vue){ log.textContent = "Pon ambos horarios (ida y vuelta)."; return; }
      const idaISO = new Date(ida).toISOString();   // hora local -> UTC
      const vueISO = new Date(vue).toISOString();
      if(new Date(vueISO) <= new Date(idaISO)){ log.textContent = "La vuelta debe ser después de la ida."; return; }
      btn.disabled = true; log.textContent = "Guardando…";
      const { error } = await sb.rpc("guardar_partidos_serie_liguilla",
        { p_serie_id: serieId, p_ida_kickoff: idaISO, p_vuelta_kickoff: vueISO });
      if(error){ log.textContent = "Error: "+error.message; btn.disabled = false; return; }
      adLiguilla();
    });
  });

  adLiguillaTickets();
}

// dibuja el bloque admin de cargar partidos ida/vuelta para cada serie ya definida
function renderAdCargador(series, partidos){
  const toLocal = iso => { const d=new Date(iso); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); };
  let html = `<div class="ad-bloque"><h3>Cargar partidos (ida y vuelta)</h3>
    <div class="d">Para cada serie ya definida, pon el arranque de <b>ida</b> y <b>vuelta</b> (hora local). Se crean los dos partidos y quedan ligados a la serie por par de equipos: ida de local el peor sembrado, vuelta de local el mejor. Puedes reajustar horarios mientras no haya resultados.</div>`;
  let algo = false;
  ["cuartos","semis","final"].forEach(ronda=>{
    (series[ronda]||[]).forEach(s=>{
      if(!s.equipo_a_id || !s.equipo_b_id) return;
      algo = true;
      const legs = partidos.filter(p=> lgCasaSerie(s,p)).slice().sort((a,b)=> new Date(a.kickoff)-new Date(b.kickoff));
      const conGol = legs.some(p=> p.goles_local!=null || p.goles_visitante!=null);
      const idaVal = legs[0] ? toLocal(legs[0].kickoff) : '';
      const vueVal = legs[1] ? toLocal(legs[1].kickoff) : '';
      const na = escapa(s.ea?.nombre_corto||s.ea?.nombre||'?');
      const nb = escapa(s.eb?.nombre_corto||s.eb?.nombre||'?');
      html += `<div class="ad-cargador" data-serie="${s.id}">
        <div class="ad-carg-tit">${RONDA_NOMBRE[ronda]} · ${nb} (local ida) vs ${na}</div>
        <div class="ad-row"><label class="ad-carg-lbl">Ida</label>
          <input type="datetime-local" class="ad-inp" style="width:auto" data-ko="ida" value="${idaVal}" ${conGol?'disabled':''}></div>
        <div class="ad-row"><label class="ad-carg-lbl">Vuelta</label>
          <input type="datetime-local" class="ad-inp" style="width:auto" data-ko="vuelta" value="${vueVal}" ${conGol?'disabled':''}></div>
        ${conGol
          ? `<div class="ad-log">Ya hay resultados en esta serie; los horarios quedan fijos.</div>`
          : `<button class="ad-btn" data-carg="${s.id}" style="margin-top:6px">${legs.length?'Actualizar horarios':'Crear partidos'}</button>`}
        <div class="ad-log oculto" data-carglog="${s.id}"></div>
      </div>`;
    });
  });
  if(!algo) html += `<div class="d">Aún no hay series con ambos equipos definidos. Marca avances arriba para que se definan.</div>`;
  html += `</div>`;
  return html;
}

  box.querySelectorAll("[data-lacc]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const id=b.dataset.id, acc=b.dataset.lacc, val=b.dataset.val==='1';
      const campo = acc==='pago' ? 'pagado' : 'bloqueado';
      const upd = { [campo]: !val };
      if(acc==='pago' && !val) upd.pagado_en = new Date().toISOString();
      const { error } = await sb.from("liguilla_ticket").update(upd).eq("id", id);
      if(error){ alert("Error: "+error.message); return; }
      adLiguillaTickets();
    });
  });
}

// =====================================================================
//  PANTALLA LIGUILLA (jugador) — Capa A: bracket de predicción
// =====================================================================
const LG = { torneo:null, tickets:[], ticketSel:null, series:null,
             pred:{ cuartos:{}, semis:{}, campeon:null },
             deadline:null, vista:'bracket', capBpartidos:0,
             partidos:[], picksB:{}, pbSel:{} };

async function pantallaLiguilla(c){
  c.innerHTML = `<p style="color:var(--pizarra)">Cargando…</p>`;

  // torneo activo
  if(!LG.torneo){
    const { data: tor } = await sb.from("torneo").select("*").eq("activo",true).maybeSingle();
    if(!tor){ c.innerHTML = `<div class="sv-vacio">Todavía no hay un torneo activo.</div>`; return; }
    LG.torneo = tor;
  }

  // mis boletos de liguilla
  const { data: tickets } = await sb.from("liguilla_ticket")
    .select("*").eq("torneo_id", LG.torneo.id).eq("usuario_id", perfil.id).order("creado_en");
  LG.tickets = tickets || [];
  if(LG.ticketSel && !LG.tickets.find(t=>t.id===LG.ticketSel)) LG.ticketSel = null;
  if(!LG.ticketSel && LG.tickets.length) LG.ticketSel = LG.tickets[0].id;

  // series del torneo
  LG.series = await cargarSeriesLiguilla(LG.torneo.id);

  // deadline de Capa A = primer kickoff de un partido de liguilla de cuartos.
  // (partido de liguilla = jornada > 17 cuyo par de equipos casa una serie de cuartos)
  LG.deadline = null; LG.capBpartidos = 0; LG.partidos = [];
  const cuartos = LG.series.cuartos || [];
  {
    const { data: pl } = await sb.from("partido")
      .select("id, jornada, kickoff, pospuesto, bloqueado_manual, goles_local, goles_visitante, "+
              "equipo_local_id, equipo_visitante_id, "+
              "loc:equipo_local_id(nombre,nombre_corto,escudo_url,color), "+
              "vis:equipo_visitante_id(nombre,nombre_corto,escudo_url,color)")
      .eq("torneo_id", LG.torneo.id).gt("jornada", 17).order("kickoff");
    LG.partidos = pl || [];
    LG.capBpartidos = LG.partidos.length;
    if(cuartos.length){
      const pares = cuartos.map(s=>[s.equipo_a_id, s.equipo_b_id]);
      const casa = (a,b)=> pares.some(p=> (p[0]===a&&p[1]===b) || (p[0]===b&&p[1]===a));
      const kicks = LG.partidos.filter(p=> casa(p.equipo_local_id, p.equipo_visitante_id)).map(p=> new Date(p.kickoff));
      if(kicks.length) LG.deadline = new Date(Math.min(...kicks.map(d=>d.getTime())));
    }
  }

  // mi bracket del boleto seleccionado
  LG.pred = { cuartos:{}, semis:{}, campeon:null };
  if(LG.ticketSel){
    const { data: br } = await sb.from("liguilla_bracket")
      .select("ronda, slot, equipo_pred_id, es_pick_campeon")
      .eq("ticket_id", LG.ticketSel);
    (br||[]).forEach(r=>{
      if(r.ronda==='cuartos') LG.pred.cuartos[r.slot] = r.equipo_pred_id;
      else if(r.ronda==='semis') LG.pred.semis[r.slot] = r.equipo_pred_id;
      else if(r.ronda==='final') LG.pred.campeon = r.equipo_pred_id;
    });
  }

  // Capa B: mis pronósticos L/E/V del boleto seleccionado (partido_id -> L/E/V)
  LG.picksB = {};
  if(LG.ticketSel){
    const { data: pb } = await sb.from("liguilla_pick")
      .select("partido_id, pronostico").eq("ticket_id", LG.ticketSel);
    (pb||[]).forEach(r=>{ LG.picksB[r.partido_id] = r.pronostico; });
  }
  LG.pbSel = Object.assign({}, LG.picksB);

  renderLiguilla(c);
}

// deriva las semis a partir de los 4 ganadores elegidos en cuartos (misma
// resiembra que el backend: por seed asc, rn1 vs rn4 y rn2 vs rn3)
function semisDerivadas(){
  const cuartos = (LG.series.cuartos||[]).slice().sort((a,b)=>a.slot-b.slot);
  if(cuartos.length !== 4) return null;
  const w = [];
  for(const s of cuartos){
    const eid = LG.pred.cuartos[s.slot];
    if(!eid) return null;
    const seed = (s.equipo_a_id===eid) ? s.seed_a : s.seed_b;
    const eq = (s.equipo_a_id===eid) ? s.ea : s.eb;
    w.push({ equipo_id:eid, seed, eq });
  }
  w.sort((a,b)=>a.seed-b.seed);
  return [ {dslot:1, a:w[0], b:w[3]}, {dslot:2, a:w[1], b:w[2]} ];
}

// limpia predicciones aguas abajo que quedaron inválidas al cambiar cuartos
function saneaPred(){
  const semis = semisDerivadas();
  if(!semis){ LG.pred.semis = {}; LG.pred.campeon = null; return; }
  semis.forEach(s=>{
    const cur = LG.pred.semis[s.dslot];
    if(cur && cur!==s.a.equipo_id && cur!==s.b.equipo_id) LG.pred.semis[s.dslot] = null;
  });
  const f1 = LG.pred.semis[1], f2 = LG.pred.semis[2];
  if(LG.pred.campeon && LG.pred.campeon!==f1 && LG.pred.campeon!==f2) LG.pred.campeon = null;
}

function lgLado(eq, seed, sel, dis, attrs){
  return `<div class="lg-lado ${sel?'sel':''} ${dis?'dis':''}" ${attrs||''}>
    <span class="seed">${seed??'?'}</span>${escudoMini(eq)}<span class="nom">${escapa(eq?.nombre_corto||eq?.nombre||'?')}</span>
  </div>`;
}

  }

  html += `<div class="lg-ronda"><div class="lg-ronda-tit"><h3>Cuartos</h3><span class="pts">3 pts c/u</span></div>`;
  cuartos.forEach(s=>{

    </div>`;

  html += `</div>`;

  // ------- SEMIS -------

  html += `<div class="lg-ronda"><div class="lg-ronda-tit"><h3>Semifinales · tus finalistas</h3><span class="pts">5 pts c/u</span></div>`;

  const f1 = semis ? LG.pred.semis[1] : null, f2 = semis ? LG.pred.semis[2] : null;
  if(!f1 || !f2){
    html += `<div class="lg-hint">Elige tus 2 finalistas para escoger campeón.</div>`;
  } else {

    const fb = (semisArr[1].a.equipo_id===f2)? semisArr[1].a : semisArr[1].b;
